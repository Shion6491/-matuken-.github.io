<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マツケンのプロフィール</title>
<style>
body {
    font-family: sans-serif;
    background-color: #f9f9f9;
    margin: 0;
    padding: 0;
    text-align: center; /* 全体中央寄せ */
}

.mainColumn {
    width: 100%;
    display: flex;
    justify-content: center; /* 中身を中央寄せ */
    padding: 2rem 0;
}

.mainColumnProfile {
    width: 60%;
    background: none; /* 背景や枠を削除 */
    padding: 0;
    text-align: center; /* 内部の文字を中央揃え */
}

.profileBodyItem {
    margin: 1.5rem 0;
}

.profileBodyItemLabel {
    font-weight: bold;
    margin-bottom: 0.5rem;
}

.profileBodyItemValue {
    margin-bottom: 0.5rem;
}

.profileBodyItemValue div {
    margin: 0.2rem 0; /* 複数行のスペース調整 */
}
</style>
</head>
<body>

<div class="mainColumn">
    <div class="mainColumnProfile">
        <h2>マツケンのプロフィール</h2>

        <div class="profileBody">
            <div class="profileBodyItem">
                <div class="profileBodyItemLabel">本名</div>
                <div class="profileBodyItemValue">村松 賢太郎（むらまつ けんたろう）</div>
            </div>

            <div class="profileBodyItem">
                <div class="profileBodyItemLabel">生年月日</div>
                <div class="profileBodyItemValue">2009年2月25日 </div>
            </div>

            <div class="profileBodyItem">
                <div class="profileBodyItemLabel">血液型</div>
                <div class="profileBodyItemValue">A型</div>
            </div>

            <div class="profileBodyItem">
                <div class="profileBodyItemLabel">出身地</div>
                <div class="profileBodyItemValue">神奈川県横浜市</div>
            </div>

            <div class="profileBodyItem">
                <div class="profileBodyItemLabel">学歴</div>
                <div class="profileBodyItemValue">甲陵高校在住</div>
            </div>

            <div class="profileBodyItem">
                <div class="profileBodyItemLabel">サイズ</div>
                <div class="profileBodyItemValue">身長189cm</div>
            </div>

            <div class="profileBodyItem">
                <div class="profileBodyItemLabel">趣味</div>
                <div class="profileBodyItemValue">サッカー，ゲーム，歴史</div>
            </div>

           

        </div>
        <hr>
    </div>
</div>

</body>
</html>
